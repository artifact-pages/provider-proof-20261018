name: Provider proof admin

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select one reviewed admin operation.
        type: choice
        required: true
        options:
          - probe-absent
          - app-deploy
          - registry-sync
      mode:
        description: Dry-run is the default; write mode applies the selected app or registry change.
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - write

permissions:
  contents: read

concurrency:
  group: provider-proof-admin
  cancel-in-progress: false

jobs:
  absent-probes:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'probe-absent' }}
    runs-on: ubuntu-24.04
    environment: proof-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the reviewed main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Assume the reference admin role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PAGES_REGISTRY_ADMIN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: provider-proof-admin-p2
      - name: Record fresh-bucket absent probes
        env:
          AWS_PROOF_BUCKET: ap-proof-231136241959-20261018
          AWS_PROOF_SITE: proof-a-20261018
        run: node scripts/aws-absent-probe.mjs

  deploy-app:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'app-deploy' }}
    runs-on: ubuntu-24.04
    environment: proof-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the reference admin role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PAGES_REGISTRY_ADMIN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: provider-proof-app
      - name: Deploy or dry-run the pinned reader app
        uses: artifact-pages/app-deploy-action@8ee0d56d20bc46e2ee555b73f4cc402852f158f5 # v0.2.0
        with:
          config: artifact-pages.yaml
          dry-run: ${{ inputs.mode == 'dry-run' }}
          publish-on: workflow_dispatch:refs/heads/main
          summary: true

  sync-registry:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'registry-sync' }}
    runs-on: ubuntu-24.04
    environment: proof-admin
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Assume the reference admin role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.ARTIFACT_PAGES_REGISTRY_ADMIN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: provider-proof-registry
      - name: Reconcile or dry-run the proof registrations
        uses: artifact-pages/registry-action@47ff737c5751748608afc3a1cd4763696f319f45 # v0.2.0
        with:
          config: artifact-pages.yaml
          dry-run: ${{ inputs.mode == 'dry-run' }}
          publish-on: workflow_dispatch:refs/heads/main
          summary: true
